# Experiment: P3-P4 head + MS-Block (YOLO-MS, 2023) — multi-kernel parallel.
# MS-Block runs kernels (1, 3, 5) in parallel on separate channel chunks
# and concatenates. Effective receptive field is varied per branch — good
# for capturing scale variety in objects (24 px median + tail to 57 px).

nc: 1
depth_multiple: 0.67
width_multiple: 0.25

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, Conv,    [64,  3, 2, 1]],
    [-1, 1, Conv,    [128, 3, 2]],
    [-1, 3, MSBlock, [128]],
    [-1, 1, Conv,    [256, 3, 2]],
    [-1, 6, MSBlock, [256]],
    [-1, 1, Conv,    [512, 3, 2]],
    [-1, 9, MSBlock, [512]],
    [-1, 1, SPPF,    [512, 5]],
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, MSBlock, [256]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 8], 1, Concat, [1]],
    [-1, 3, MSBlock, [512]],

    [[11, 14], 1, Detect, [nc, anchors]],
  ]
