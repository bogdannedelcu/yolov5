# Experiment: P3-P4 head + CoordConv stem (Liu et al, NeurIPS 2018).
# Adds normalized x/y coordinate channels before the first Conv. Helps
# the network learn absolute spatial localization — particularly useful
# for small objects where positional context matters more than features.
# Orthogonal to other block changes; identical to the p3p4 baseline
# elsewhere (C3 backbone).

nc: 1
depth_multiple: 0.33
width_multiple: 0.125

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, CoordConv, [64,  3, 2, 1]],   # CoordConv stem (RGB+xy → 64ch)
    [-1, 1, Conv,      [128, 3, 2]],
    [-1, 3, C3,        [128]],
    [-1, 1, Conv,      [256, 3, 2]],
    [-1, 6, C3,        [256]],
    [-1, 1, Conv,      [512, 3, 2]],
    [-1, 9, C3,        [512]],
    [-1, 1, SPPF,      [512, 5]],
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, C3, [256, False]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 8], 1, Concat, [1]],
    [-1, 3, C3, [512, False]],

    [[11, 14], 1, Detect, [nc, anchors]],
  ]
