# Experiment: P3-P4 head + YOLOv8 C2f blocks (drop-in C3 replacement).
# Reasoning: C2f keeps every intermediate bottleneck output (concat at end)
# vs C3 which discards them — better gradient flow, similar param count.
# Output footprint identical to p3p4_w0125 (~35 KiB at 480x640).

nc: 1
depth_multiple: 0.67
width_multiple: 0.25

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, Conv,  [64,  3, 2, 1]],
    [-1, 1, Conv,  [128, 3, 2]],
    [-1, 3, C2f,   [128]],
    [-1, 1, Conv,  [256, 3, 2]],
    [-1, 6, C2f,   [256]],
    [-1, 1, Conv,  [512, 3, 2]],
    [-1, 9, C2f,   [512]],
    [-1, 1, SPPF,  [512, 5]],
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, C2f, [256, False]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 8], 1, Concat, [1]],
    [-1, 3, C2f, [512, False]],

    [[11, 14], 1, Detect, [nc, anchors]],
  ]
