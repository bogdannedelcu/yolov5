# P3-P4 + MSBlock + double FPN-PAN cycle. Same output footprint, richer
# feature fusion. Backbone identical; head does FPN→PAN twice before Detect.

nc: 1
depth_multiple: 0.33
width_multiple: 0.125

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, Conv,    [64,  3, 2, 1]],   # 0  P1/2
    [-1, 1, Conv,    [128, 3, 2]],      # 1  P2/4
    [-1, 3, MSBlock, [128]],            # 2
    [-1, 1, Conv,    [256, 3, 2]],      # 3  P3/8 ← saved
    [-1, 6, MSBlock, [256]],            # 4
    [-1, 1, Conv,    [512, 3, 2]],      # 5  P4/16 ← saved
    [-1, 9, MSBlock, [512]],            # 6
    [-1, 1, SPPF,    [512, 5]],         # 7
  ]

head: [
    # ---- FPN cycle 1 ----
    [-1, 1, Conv, [256, 1, 1]],                    # 8   reduce P4
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],    # 9
    [[-1, 4], 1, Concat, [1]],                     # 10  cat backbone P3
    [-1, 3, MSBlock, [256]],                       # 11  P3 fused 1

    # ---- PAN cycle 1 ----
    [-1, 1, Conv, [256, 3, 2]],                    # 12  P3 → P4
    [[-1, 8], 1, Concat, [1]],                     # 13  cat reduced P4
    [-1, 3, MSBlock, [512]],                       # 14  P4 fused 1

    # ---- FPN cycle 2 (re-fuse P3 with refreshed P4) ----
    [-1, 1, Conv, [256, 1, 1]],                    # 15  reduce P4_fused1
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],    # 16
    [[-1, 11], 1, Concat, [1]],                    # 17  cat P3_fused1
    [-1, 3, MSBlock, [256]],                       # 18  P3 fused 2 ← DETECT

    # ---- PAN cycle 2 ----
    [-1, 1, Conv, [256, 3, 2]],                    # 19  P3 → P4
    [[-1, 15], 1, Concat, [1]],                    # 20  cat reduced P4
    [-1, 3, MSBlock, [512]],                       # 21  P4 fused 2 ← DETECT

    [[18, 21], 1, Detect, [nc, anchors]],          # 22  Detect(P3, P4)
  ]
