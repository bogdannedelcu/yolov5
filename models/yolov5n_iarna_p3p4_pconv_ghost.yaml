# Experiment: P3-P4 head + FasterNet PConv stem + Ghost backbone blocks.
# PConv (FasterNet, CVPR 2023) operates conv on a fraction of channels
# and pass-through the rest — ~2x faster than full Conv at small accuracy
# cost. Ghost (GhostNet, CVPR 2020) generates "cheap" features via
# DepthwiseConv on the primary half. Both EdgeTPU-friendly.
# Goal: smallest / fastest variant, see where accuracy lands.

nc: 1
depth_multiple: 0.33
width_multiple: 0.125

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, Conv,  [64,  3, 2, 1]],
    [-1, 1, PConv, [128, 3, 2]],
    [-1, 3, Ghost, [128]],
    [-1, 1, PConv, [256, 3, 2]],
    [-1, 6, Ghost, [256]],
    [-1, 1, PConv, [512, 3, 2]],
    [-1, 9, Ghost, [512]],
    [-1, 1, SPPF,  [512, 5]],
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, Ghost, [256]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 8], 1, Concat, [1]],
    [-1, 3, Ghost, [512]],

    [[11, 14], 1, Detect, [nc, anchors]],
  ]
