# Experiment: P3-P4 head + YOLOv9 GELAN blocks.
# GELAN = Generalized ELAN (Wang et al, 2024) — split into halves, run
# bottleneck pairs, collect every intermediate, concat all + project.
# Cleaner gradient pathways than C3/C2f; targets best small-object accuracy
# with the same backbone topology. EdgeTPU-friendly (Conv + Concat + Add).

nc: 1
depth_multiple: 0.33
width_multiple: 0.125

anchors:
  - [16, 16]
  - [32, 32]

backbone:
  [
    [-1, 1, Conv,   [64,  3, 2, 1]],
    [-1, 1, Conv,   [128, 3, 2]],
    [-1, 3, GELAN,  [128]],
    [-1, 1, Conv,   [256, 3, 2]],
    [-1, 6, GELAN,  [256]],
    [-1, 1, Conv,   [512, 3, 2]],
    [-1, 9, GELAN,  [512]],
    [-1, 1, SPPF,   [512, 5]],
  ]

head: [
    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],
    [-1, 3, GELAN, [256, False]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 8], 1, Concat, [1]],
    [-1, 3, GELAN, [512, False]],

    [[11, 14], 1, Detect, [nc, anchors]],
  ]
