# YOLOv5n adapted for the `iarna` dataset.
#
# Dataset profile (2,299 train objects @ imgsz=640):
#   - aspect w/h median = 0.97 (square targets)
#   - sqrt(w*h) percentiles: p25=20  p50=24  p75=28  p90=33  p99=41
#   - max ~57 px → P5/32 stride is over-sized, but kept for receptive field
#
# Single-anchor-per-scale (na=1) configuration:
#   - reduces output volume from `3*(5+nc)` to `(5+nc)` per cell (3× smaller)
#   - matches the squarish single-mode size distribution of iarna
#   - keeps the detector head as a 1×1 conv with `na*(5+nc) = 6` filters per scale
#
# Per-cell output channels = na * (5 + nc) = 1 * (5 + 1) = 6
# At imgsz 480×640 the int8 output footprint is:
#   P3/8  60×80×6 =  28,800 B
#   P4/16 30×40×6 =   7,200 B
#   P5/32 15×20×6 =   1,800 B
#   total          =  37,800 B  (~37 KiB)

nc: 1                  # number of classes (iarna: persoana)
depth_multiple: 0.33   # nano depth
width_multiple: 0.25   # nano width

# 1 anchor per scale (na=1). Initial values are generic seeds — `train.py`
# (without `--noautoanchor`) and `train_tf_native.py` will run kmeans on the
# label distribution at start of training and replace these in-memory if the
# Best Possible Recall (BPR) is below 0.98.
anchors:
  - [10, 13]    # P3/8  — small targets (auto-tuned)
  - [30, 30]    # P4/16 — medium targets (auto-tuned)
  - [60, 60]    # P5/32 — larger targets (auto-tuned)

# YOLOv5 v6.0 backbone (unchanged from yolov5n.yaml)
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]],   # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]],     # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]],     # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]],    # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]],       # 9
  ]

# YOLOv5 v6.0 head (unchanged structure; Detect adapts to len(anchors[0])/2 = 1)
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]],          # cat backbone P4
    [-1, 3, C3, [512, False]],          # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],          # cat backbone P3
    [-1, 3, C3, [256, False]],          # 17 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]],         # cat head P4
    [-1, 3, C3, [512, False]],          # 20 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]],         # cat head P5
    [-1, 3, C3, [1024, False]],         # 23 (P5/32-large)

    [[17, 20, 23], 1, Detect, [nc, anchors]],   # Detect(P3, P4, P5)
  ]
