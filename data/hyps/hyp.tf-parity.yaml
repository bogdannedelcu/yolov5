# Hyperparams for PT vs TF parity comparison.
# Matches train_tf_native.py defaults: SGD lr=0.01, momentum=0.937, wd=5e-4,
# loss gains box=0.05 obj=1.0 cls=0.5, anchor_t=4.0, fliplr=0.5, no other augs.

lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0
hsv_s: 0
hsv_v: 0
degrees: 0.0
translate: 0
scale: 0
shear: 0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
