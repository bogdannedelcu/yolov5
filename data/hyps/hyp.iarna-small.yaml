# Hyperparams for iarna small-object training.
# All augmentations that shrink, crop, or compose images are OFF.
# Kept: HSV jitter (color robustness), horizontal flip (people are bilaterally
# symmetric in plan view).

lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.0      # keep targets centered (small objects, edge-sensitive)
scale: 0.0          # NO downscale — small objects must keep their pixels
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0         # OFF — would compose 4 images at half size each
mixup: 0.0          # OFF — would dilute small targets
copy_paste: 0.0     # OFF — segmentation paste, irrelevant for plain detect
